[pytest]
# Makes `src` (and `app.py` at the repo root) importable regardless of how
# pytest is invoked (bare `pytest`, `python -m pytest`, from an IDE, etc.) --
# without this, only `python -m pytest` run from the repo root would reliably
# put the repo root on sys.path.
pythonpath = .
markers =
    slow: exercises nested_cv_evaluate end-to-end; skip with -m "not slow" for a fast loop
